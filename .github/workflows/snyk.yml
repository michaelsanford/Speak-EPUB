name: Snyk

# Security scanning: Snyk Open Source (dependency CVEs) and Snyk Code (SAST).
# Results are published to the repository's Code scanning tab as SARIF, and the
# default branch is snapshotted to snyk.io so newly-disclosed CVEs raise alerts
# against this code even when nothing here changes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a CVE disclosed against an untouched dependency still surfaces.
    - cron: '53 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk:
    name: Snyk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload SARIF to code scanning

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Snyk CLI
        uses: snyk/actions/setup@12140f4059e244892ae643824a95459a102120dd # master, 2026-08-27

      # Each scan step swallows its exit code so that the SARIF always uploads;
      # the gate step at the end is what actually fails the build.
      #   0 = clean   1 = issues at/above threshold   2 = CLI error   3 = nothing to scan
      - name: Snyk Open Source
        id: sca
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          snyk test --all-projects --severity-threshold=high --sarif-file-output=snyk-sca.sarif
          code=$?
          if [ "$code" -eq 3 ]; then
            echo "No supported manifests found; treating as clean."
            code=0
          fi
          echo "exit=$code" >> "$GITHUB_OUTPUT"

      - name: Snyk Code
        id: code
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          snyk code test --severity-threshold=high --sarif-file-output=snyk-code.sarif
          code=$?
          if [ "$code" -eq 3 ]; then
            echo "No Snyk Code supported source files found; treating as clean."
            code=0
          fi
          echo "exit=$code" >> "$GITHUB_OUTPUT"

      - name: Upload Open Source results
        if: ${{ !cancelled() && hashFiles('snyk-sca.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          sarif_file: snyk-sca.sarif
          category: snyk-open-source

      - name: Upload Code results
        if: ${{ !cancelled() && hashFiles('snyk-code.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      # A snapshot on the default branch is what lets snyk.io keep re-testing this
      # project against newly-published advisories between pushes.
      - name: Snapshot to snyk.io
        if: ${{ github.event_name == 'push' }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor --all-projects

      - name: Gate
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          fail=0
          check() {
            name="$1"; code="${2:-0}"
            case "$code" in
              0) echo "$name: clean" ;;
              1) echo "::error::$name found issues at or above the high severity threshold"; fail=1 ;;
              *) echo "::error::$name did not run (exit $code). A missing or invalid SNYK_TOKEN repository secret is the usual cause; see the step log."; fail=1 ;;
            esac
          }
          check "Snyk Open Source" "${{ steps.sca.outputs.exit }}"
          check "Snyk Code" "${{ steps.code.outputs.exit }}"
          exit $fail
